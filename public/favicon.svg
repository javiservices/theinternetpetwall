<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldPaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="pawAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Premium Dark Squircle Base with Metallic Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="2.5" />

  <!-- Ambient Glow Aura -->
  <circle cx="32" cy="33" r="20" fill="url(#pawAura)" />

  <!-- 4 Radiant Toe Beans -->
  <ellipse cx="19" cy="24" rx="4.2" ry="5.8" transform="rotate(-18 19 24)" fill="url(#goldPaw)" />
  <ellipse cx="27.5" cy="18" rx="4.4" ry="6" transform="rotate(-6 27.5 18)" fill="url(#goldPaw)" />
  <ellipse cx="36.5" cy="18" rx="4.4" ry="6" transform="rotate(6 36.5 18)" fill="url(#goldPaw)" />
  <ellipse cx="45" cy="24" rx="4.2" ry="5.8" transform="rotate(18 45 24)" fill="url(#goldPaw)" />

  <!-- Main Palm Pad: Organic heart-curved paw base -->
  <path d="M32 29 C24.5 29 19.5 34.5 19.5 41 C19.5 45.5 23 48.5 27 48.5 C29.2 48.5 31.2 47 32 47 C32.8 47 34.8 48.5 37 48.5 C41 48.5 44.5 45.5 44.5 41 C44.5 34.5 39.5 29 32 29 Z" fill="url(#goldPaw)" />

  <!-- Center Diamond Sparkle -->
  <path d="M32 34.5 L33.2 38 L36.7 39.2 L33.2 40.4 L32 43.9 L30.8 40.4 L27.3 39.2 L30.8 38 Z" fill="#FFFFFF" opacity="0.95" />
</svg>